[package]
name = "swoop"
version = "0.1.0"
description = "Swoop — файлы с iPhone на ПК по локальной сети"
edition = "2021"

[lib]
name = "swoop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
if-addrs = "0.15.0"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
